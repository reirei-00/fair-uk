name: Fair-UK evaluation tests

on:
  pull_request:
    paths:
      - 'lm_eval/fair_uk/**'
      - 'tests/fair_uk/**'
      - 'pyproject.toml'
      - '.github/workflows/fair-uk-tests.yml'
  push:
    branches: [main, feat/fairness-evaluation]
    paths:
      - 'lm_eval/fair_uk/**'
      - 'tests/fair_uk/**'
      - 'pyproject.toml'
      - '.github/workflows/fair-uk-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[fair-uk,fair-uk-openai,fair-uk-gemini]' 'transformers==4.46.3' pytest ruff
      - run: ruff check lm_eval/fair_uk tests/fair_uk
      - run: pytest tests/fair_uk -q
        env:
          HF_HUB_OFFLINE: '1'
          TOKENIZERS_PARALLELISM: 'false'
