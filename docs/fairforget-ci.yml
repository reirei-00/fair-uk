name: FairForget evaluation tests

on:
  pull_request:
    paths:
      - 'lm_eval/fairforget/**'
      - 'tests/fairforget/**'
      - 'pyproject.toml'
      - '.github/workflows/fairforget-tests.yml'
  push:
    branches: [main, feat/fairness-evaluation]
    paths:
      - 'lm_eval/fairforget/**'
      - 'tests/fairforget/**'
      - 'pyproject.toml'
      - '.github/workflows/fairforget-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[fairforget]' 'transformers==4.46.3' pytest ruff
      - run: ruff check lm_eval/fairforget tests/fairforget
      - run: pytest tests/fairforget -q
        env:
          HF_HUB_OFFLINE: '1'
          TOKENIZERS_PARALLELISM: 'false'
